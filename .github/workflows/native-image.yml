---
name: "Native Image"
"on":
  workflow_dispatch: null
  pull_request: null
  push:
    branches:
    - "main"
jobs:
  native-image:
    runs-on: "ubuntu-latest"
    env:
      GH_TOKEN: "${{ secrets.GH_TOKEN }}"
    permissions:
      contents: "read"
    strategy:
      fail-fast: false
      matrix:
        app:
        - "gateway"
        - "iam"
        - "transactions"
    steps:
    - uses: "actions/checkout@v7.0.0"
    - name: "Set up Java 25"
      uses: "actions/setup-java@v5.4.0"
      with:
        java-version: "25.0.3"
        distribution: "graalvm"
    - name: "Setup Gradle"
      uses: "gradle/actions/setup-gradle@v6.2.0"
      with:
        cache-provider: "basic"
        gradle-version: "9.6.1"
    - name: "Build native image (${{ matrix.app }})"
      run: "./gradlew :${{ matrix.app }}:nativeCompile --console=plain --no-daemon"
